<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="雲科大智慧機器人學士學位學程招生 AI 助理">
  <title>雲科大智慧機器人學程招生 AI 助理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="yuntech-logo.png" alt="國立雲林科技大學校徽">
        <div><div class="brand-name">YunTech Bachelor Program in Intelligent Robotics</div><div class="brand-subtitle">智慧機器人學士學位學程</div></div>
      </div>
      <button id="statsBtn" class="stats-btn" type="button">使用統計</button>
    </div>
  </header>
  <main class="hero-section">
    <div class="hero-overlay"></div><div class="star-shape star-1"></div><div class="star-shape star-2"></div><div class="star-shape star-3"></div>
    <div class="hero-inner">
      <section class="hero-copy">
        <span class="hero-badge">智慧機器人學程招生</span>
        <h1>驅動智慧，<br>打造未來</h1>
        <p>從機械、電控到人工智慧，探索跨域實作課程、入學管道與未來出路。</p>
        <a class="official-link" href="https://irobot.yuntech.edu.tw/" target="_blank" rel="noopener noreferrer">前往學程官方網站 ↗</a>
        <div class="service-state"><span id="serviceDot" class="status-dot"></span><span id="serviceText">正在檢查模型服務…</span></div>
      </section>
      <section class="chat-card" aria-label="AI 聊天室">
        <div class="chat-card-header"><div class="chat-card-title">智慧機器人招生 AI</div><div class="chat-card-meta">繁體中文</div></div>
        <div id="chatWindow" class="chat-window" aria-live="polite">
          <div id="chatBox" class="chat-box">
            <div class="message agent"><div class="avatar" aria-hidden="true">AI</div><div class="bubble"><p class="answer-text">你好！我是雲科大機器人招生 AI 助理小悠。有什麼可以為您服務的嗎OUO </p></div></div>
          </div>
        </div>
        <div class="topic-toggle-wrapper"><button id="toggleTopicBtn" class="topic-toggle-btn" type="button" aria-expanded="true">常見問題 −</button></div>
        <div id="topicContainer" class="topic-buttons-container open">
          <div class="topic-buttons">
            <button type="button" class="topic-btn">智慧機器人學程在學什麼？</button><button type="button" class="topic-btn">有哪些入學管道？</button><button type="button" class="topic-btn">備審資料如何準備？</button><button type="button" class="topic-btn">有哪些機器人實作課程？</button><button type="button" class="topic-btn">什麼樣的學生適合就讀？</button><button type="button" class="topic-btn">畢業後有哪些出路？</button>
          </div>
        </div>
        <form id="chatForm" class="input-area">
          <div class="input-inner"><textarea id="userInput" class="input-box" placeholder="輸入你的問題…" rows="1" maxlength="2000" required></textarea><button id="sendBtn" class="send-btn" type="submit">送出</button></div>
          <p class="input-hint">Enter 送出，Shift + Enter 換行</p>
        </form>
      </section>
    </div>
  </main>
  <div id="statsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="statsTitle"><div class="modal-header"><h2 id="statsTitle">使用統計</h2><button id="closeStats" class="close-btn" type="button" aria-label="關閉">×</button></div><div id="statsBody" class="modal-body"></div></div>
  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
